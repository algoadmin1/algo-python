<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>algoz Tutorial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Pop-up overlay style */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Pop-up window style */
        .popup-window {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        /* Button styles */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        .btn-play {
            background-color: #007bff;
            color: #fff;
        }

        .btn-cancel {
            background-color: #ff4d4d;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- Preload audio -->
    <audio id="tutorialAudio" preload="auto">
        <source src="tutorial.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Pop-up container -->
    <div class="popup-overlay" id="popup">
        <div class="popup-window">
            <h3>Tutorial Audio</h3>
            <p>Press "Play" to listen or "Cancel" to close this pop-up.</p>
            <button class="btn btn-play" id="playButton">Play</button>
            <button class="btn btn-cancel" id="cancelButton">Cancel</button>
        </div>
    </div>

    <script>
        // Get references to elements
        const audio = document.getElementById('tutorialAudio');
        const popup = document.getElementById('popup');
        const playButton = document.getElementById('playButton');
        const cancelButton = document.getElementById('cancelButton');

        // Play the audio when 'Play' is clicked
        playButton.addEventListener('click', () => {
            audio.play();
        });

        // Close the pop-up when 'Cancel' is clicked
        cancelButton.addEventListener('click', () => {
            popup.style.display = 'none';
            audio.pause();
            audio.currentTime = 0; // Reset the audio
        });
    </script>
</body>
</html>
