            <script>
                const datePicker = document.getElementById('date-picker');
            
                

                 datePicker.addEventListener('change', () => {
                    const selectedDate = datePicker.value; // Get the date in YYYY-MM-DD format
                    const unixTimestamp = new Date(selectedDate).getTime() / 1000; // Convert to Unix timestamp

                    const today = new Date();
                    const selectedDateObj = new Date(selectedDate);
                    const timeDifference = selectedDateObj - today;
                    const daysTilExpiry = Math.ceil(timeDifference / (1000 * 60 * 60 * 24)); // Calculate days until expiry

                    console.log(`Selected date: ${selectedDate}, Unix timestamp: ${unixTimestamp}`);
                    console.log(`Days until expiry: ${daysTilExpiry}`);
                    // You can use daysTilExpiry as needed here
                });
            </script>
